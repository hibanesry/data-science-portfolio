<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e3e8f0;--accent:#3157d5;--green:#16845b;--red:#d63d52}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
main{width:min(100% - 28px,900px);margin:28px auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{margin:0;font-size:clamp(25px,4vw,34px)}.subtitle{color:var(--muted);margin:7px 0 0}
.currency{font-size:13px;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 15px #17203308}
.card .label{color:var(--muted);font-size:13px;margin-bottom:8px}.amount{font-size:clamp(19px,3vw,27px);font-weight:800;overflow-wrap:anywhere}
.income{color:var(--green)}.expense{color:var(--red)}
.layout{display:grid;grid-template-columns:minmax(0, .85fr) minmax(0,1.15fr);gap:16px}
h2{font-size:19px;margin:0 0 16px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #cfd6e2;border-radius:9px;background:#fff;color:var(--ink);font:inherit;min-width:0}
input:focus,select:focus,button:focus-visible{outline:3px solid #aabaff;outline-offset:1px}
.type-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-option{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:14px}
.type-option input{width:auto}
.primary{width:100%;margin-top:16px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:13px;font-weight:700;font-size:15px;cursor:pointer}
.secondary{background:#eef2ff;color:#263f9d;border:0;border-radius:8px;padding:9px 11px;cursor:pointer;font-weight:700}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.transactions{display:grid;gap:9px}
.transaction{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px}
.dot{width:11px;height:11px;border-radius:50%;flex:none}.tx-main{min-width:0;flex:1;text-align:left}.tx-title{font-weight:700;overflow-wrap:anywhere}.tx-meta{font-size:12px;color:var(--muted);margin-top:4px}
.tx-right{text-align:right;flex:none}.tx-amount{font-weight:800}.delete{display:block;margin:5px 0 0 auto;background:transparent;color:var(--red);border:0;padding:3px;cursor:pointer;font-size:12px}
.empty{text-align:center;padding:24px 8px;color:var(--muted);border:1px dashed #cfd6e2;border-radius:11px}
.footer{color:var(--muted);font-size:12px;text-align:center;margin:18px 0}
@media(max-width:680px){main{margin:18px auto}.summary{gap:7px}.card{padding:12px}.layout{grid-template-columns:1fr}.summary .label{font-size:11px}.filters{grid-template-columns:1fr 1fr}}
@media(max-width:390px){.summary{grid-template-columns:1fr}.summary .card{padding:14px}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>💰 Expense Tracker</h1><p class="subtitle">A simple place to track your money.</p></div>
  <div class="currency">Currency: Indian Rupees (₹)</div>
</header>

<section class="summary" aria-label="Financial summary">
  <div class="card"><div class="label">Total Income</div><div id="totalIncome" class="amount income">₹0.00</div></div>
  <div class="card"><div class="label">Total Expenses</div><div id="totalExpense" class="amount expense">₹0.00</div></div>
  <div class="card"><div class="label">Balance</div><div id="balance" class="amount">₹0.00</div></div>
</section>

<div class="layout">
<section class="card">
  <h2>Add a transaction</h2>
  <form id="transactionForm">
    <label for="title">Description</label>
    <input id="title" name="title" maxlength="70" placeholder="e.g. Lunch, Salary" required>
    <label for="amount">Amount (₹)</label>
    <input id="amount" name="amount" type="number" min="0.01" max="100000000" step="0.01" placeholder="e.g. 250" required>
    <label>Transaction type</label>
    <div class="type-row">
      <label class="type-option"><input type="radio" name="type" value="income"> Income</label>
      <label class="type-option"><input type="radio" name="type" value="expense" checked> Expense</label>
    </div>
    <label for="category">Category</label>
    <select id="category" name="category">
      <option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option><option>Salary</option><option>Education</option><option>Health</option><option>Other</option>
    </select>
    <label for="date">Date</label>
    <input id="date" name="date" type="date" required>
    <button class="primary" type="submit">+ Add transaction</button>
  </form>
</section>

<section class="card">
  <h2>Transactions</h2>
  <div class="filters">
    <input id="search" type="search" placeholder="Search transactions…" aria-label="Search transactions">
    <select id="filterType" aria-label="Filter transaction type"><option value="all">All types</option><option value="income">Income only</option><option value="expense">Expenses only</option></select>
  </div>
  <div id="transactions" class="transactions"><div class="empty">No transactions yet. Add your first one.</div></div>
  <button id="clearAll" class="secondary" type="button" style="margin-top:12px">Clear all transactions</button>
</section>
</div>
<p class="footer">Demo project · Data is saved in this browser on this device.</p>
</main>
<script>
(() => {
const STORAGE_KEY='expenseTrackerTransactionsV1';
const form=document.getElementById('transactionForm');
const titleInput=document.getElementById('title');
const amountInput=document.getElementById('amount');
const typeInputs=[...document.querySelectorAll('input[name="type"]')];
const categoryInput=document.getElementById('category');
const dateInput=document.getElementById('date');
const transactionsEl=document.getElementById('transactions');
const searchInput=document.getElementById('search');
const filterType=document.getElementById('filterType');
let transactions=[];
const today=new Date();
dateInput.value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');
function load(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY);
  const parsed=raw?JSON.parse(raw):[];
  transactions=Array.isArray(parsed)?parsed.filter(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&Number.isFinite(Number(t.amount))&&['income','expense'].includes(t.type)):[];
 }catch(e){transactions=[]}
}
function save(){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(transactions))}
 catch(e){alert('Could not save in this browser. You can still use this page, but data may not persist.')}
}
function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:2}).format(n)}
function renderSummary(){
 const income=transactions.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
 const expense=transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
 document.getElementById('totalIncome').textContent=money(income);
 document.getElementById('totalExpense').textContent=money(expense);
 const bal=income-expense, balanceEl=document.getElementById('balance');
 balanceEl.textContent=money(bal);balanceEl.className='amount '+(bal<0?'expense':'income');
}
function renderTransactions(){
 const query=searchInput.value.trim().toLowerCase(), kind=filterType.value;
 const visible=transactions.filter(t=>(kind==='all'||t.type===kind)&&[t.title,t.category,t.date,t.type].some(v=>String(v).toLowerCase().includes(query)));
 transactionsEl.replaceChildren();
 if(!visible.length){
  const empty=document.createElement('div');empty.className='empty';empty.textContent=transactions.length?'No matching transactions.':'No transactions yet. Add your first one.';transactionsEl.appendChild(empty);return;
 }
 [...visible].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).forEach(t=>{
  const row=document.createElement('article');row.className='transaction';
  const dot=document.createElement('span');dot.className='dot';dot.style.background=t.type==='income'?'var(--green)':'var(--red)';
  const main=document.createElement('div');main.className='tx-main';
  const name=document.createElement('div');name.className='tx-title';name.textContent=t.title;
  const meta=document.createElement('div');meta.className='tx-meta';meta.textContent=t.category+' · '+t.date+' · '+(t.type==='income'?'Income':'Expense');
  main.append(name,meta);
  const right=document.createElement('div');right.className='tx-right';
  const amount=document.createElement('div');amount.className='tx-amount '+(t.type==='income'?'income':'expense');amount.textContent=(t.type==='income'?'+':'−')+money(Number(t.amount));
  const del=document.createElement('button');del.className='delete';del.type='button';del.textContent='Delete';del.setAttribute('aria-label','Delete '+t.title);
  del.addEventListener('click',()=>{transactions=transactions.filter(x=>x.id!==t.id);save();render()});
  right.append(amount,del);row.append(dot,main,right);transactionsEl.appendChild(row);
 });
}
function render(){renderSummary();renderTransactions()}
form.addEventListener('submit',e=>{
 e.preventDefault();
 const title=titleInput.value.trim(), amount=Number(amountInput.value), type=typeInputs.find(i=>i.checked)?.value||'expense', date=dateInput.value;
 if(!title){alert('Please enter a description.');titleInput.focus();return}
 if(!Number.isFinite(amount)||amount<=0){alert('Enter an amount greater than ₹0.');amountInput.focus();return}
 if(!date){alert('Please choose a date.');dateInput.focus();return}
 transactions.push({id:(Date.now().toString(36)+Math.random().toString(36).slice(2,8)),title,amount,type,category:categoryInput.value,date});
 save();form.reset();typeInputs.find(i=>i.value==='expense').checked=true;dateInput.value=date;render();titleInput.focus();
});
searchInput.addEventListener('input',renderTransactions);
filterType.addEventListener('change',renderTransactions);
document.getElementById('clearAll').addEventListener('click',()=>{
 if(!transactions.length){alert('There are no transactions to clear.');return}
 if(confirm('Delete all transactions? This cannot be undone.')){transactions=[];save();render()}
});
load();render();
})();
</script>
</body>
</html>
